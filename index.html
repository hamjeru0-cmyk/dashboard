<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jeru Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script>
/* Standalone version: everything is saved on this phone (no claude.ai sign-in needed). */
window.claude={use:async function(name){
  if(name!=="db") return null;
  const KEY="jeru-dashboard-db", FEEDS={"feed/events": {"runs": [{"date": "Date TBC", "note": "Free to join, costume event", "place": "Baguio City", "title": "Baguio Horror Festival (Zombie Walk)", "url": "https://allevents.in/Baguio"}, {"date": "Check for new listings", "note": "No confirmed December fun run found yet", "place": "Burnham Park / Camp John Hay", "title": "Baguio running calendar (Race Roster)", "url": "https://raceroster.com"}], "updated": "Nov 21", "workshops": [{"date": "No schedule posted yet", "note": "Free, advanced level", "place": "Baguio", "title": "Sony Baguio Wedding Masterclass (videography)", "url": "https://experience.sony-asia.com/ph/home/WorkshopDetails/1506"}, {"date": "Browse upcoming", "note": "Workshops, photo walks, classes", "place": "Baguio", "title": "Photography events in Baguio", "url": "https://allevents.in/baguio/photography"}]}, "feed/news": {"items": [{"summary": "New top-tier models for the hardest technical work.", "title": "Claude Fable 5.2 and Mythos 5.2", "url": "https://claude.com/blog/category/announcements"}, {"summary": "New feature for tracking and understanding your money.", "title": "Personal Finance in Claude", "url": "https://claude.com/blog/category/announcements"}, {"summary": "Ready-made skills for fundraising, marketing and hiring.", "title": "Claude for Nonprofits plugin", "url": "https://claude.com/blog/category/announcements"}, {"summary": "Make designs, prototypes and slides by talking to Claude.", "title": "Claude Design", "url": "https://support.claude.com/en/articles/12138966-release-notes"}], "updated": "Nov 21"}, "feed/market": {"updated": "Nov 21", "series": [{"name": "S&P 500", "pts": [["Nov 11", 7619.38], ["Nov 13", 7561.67], ["Nov 17", 7340.53], ["Nov 18", 7323.63], ["Nov 19", 7175.83]]}, {"name": "Nasdaq", "pts": [["Nov 11", 25466.19], ["Nov 12", 25366.09], ["Nov 18", 24429.88], ["Nov 19", 23879.2]]}, {"name": "PSEi", "pts": [["Nov 5", 5778.14], ["Nov 13", 5593.49], ["Nov 16", 5481.88], ["Nov 18", 5511.84], ["Nov 19", 5477.91]]}, {"name": "USD / PHP", "pts": [["Nov 4", 63.535], ["Nov 5", 62.97], ["Nov 12", 63.7], ["Nov 13", 63.72]]}]}};
  let store={}; try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
  Object.assign(store,FEEDS);                      // feeds always come from this file
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} };
  const subs={}, csubs={};
  const snap=p=>({exists:!!store[p],data:()=>store[p]?JSON.parse(JSON.stringify(store[p])):undefined});
  const colSnap=c=>({docs:Object.keys(store).filter(k=>k.startsWith(c+"/")).map(k=>({id:k.slice(c.length+1),data:()=>JSON.parse(JSON.stringify(store[k]))}))});
  const notify=p=>{ (subs[p]||[]).forEach(f=>f(snap(p))); const c=p.split("/")[0]; (csubs[c]||[]).forEach(f=>f(colSnap(c))); };
  /* Task list pushed from Claude: tasks.json in this repo, checked every minute.
     Tasks from the file come first, sorted by priority (p: 1 = highest). Ticks and tasks you add on this phone are kept. */
  const todayStr=()=>{ const d=new Date(), z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); };
  async function pullTasks(){
    try{
      const r=await fetch("tasks.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
      const j=await r.json(); let changed=false;
      for(const day in j){
        const rem=(j[day].items||[]).slice().sort((a,b)=>(a.p||9)-(b.p||9));
        const path="checklist/"+day, cur=(store[path]&&Array.isArray(store[path].items))?store[path].items:[];
        const doneBy={}; cur.forEach(i=>{ doneBy[i.t]=i.done; });
        const remT=new Set(rem.map(i=>i.t));
        const next=rem.map(i=>({t:i.t,done:!!doneBy[i.t]||!!i.done,p:i.p,r:1}));
        cur.forEach(i=>{ if(!i.r && !remT.has(i.t)) next.push(i); });
        if(JSON.stringify(next)!==JSON.stringify(cur)){ store[path]={date:day,items:next,carried:true}; changed=true; if(day===todayStr()) notify(path); }
      }
      if(changed) save();
    }catch(e){}
  }
  pullTasks(); setInterval(pullTasks,60000);
  return {
    doc:p=>({ set:async d=>{ store[p]=JSON.parse(JSON.stringify(d)); save(); notify(p); },
              get:async()=>snap(p),
              onSnapshot:f=>{ (subs[p]=subs[p]||[]).push(f); setTimeout(()=>f(snap(p)),0); return ()=>{ subs[p]=(subs[p]||[]).filter(x=>x!==f); }; } }),
    collection:c=>({ onSnapshot:f=>{ (csubs[c]=csubs[c]||[]).push(f); setTimeout(()=>f(colSnap(c)),0); return ()=>{}; } })
  };
}};
</script>
<style>
:root{
  --bg:#070d24; --card:#111c45; --line:#22306a; --text:#ffffff; --mute:#9aa8d8;
  --accent:#4169e1; --accent2:#9fb4ff; --red:#e63946; --field:#0a1233;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden;
  padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
/* rotation-locked phone held upright: show the landscape layout sideways */
@media (orientation:portrait){
  .stage{inset:auto;top:0;left:0;width:100vh;height:100vw;padding:16px 22px;
    transform-origin:top left;transform:translateX(100vw) rotate(90deg)}
}
.viewport{position:relative;width:100%;height:100%;overflow:hidden}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .4s ease}
.slide{flex:0 0 100%;height:100%;display:flex;flex-direction:column;min-width:0;padding:4px 4px 26px}
.head{display:flex;justify-content:space-between;align-items:baseline;flex:none;margin-bottom:10px}
.head h1{margin:0;font-size:24px;font-weight:700}
.head small{color:var(--mute);font-size:13px}
.empty{color:var(--mute);font-size:15px;padding:6px 0;line-height:1.5}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:600;font-size:16px}

/* home */
.home{justify-content:center;align-items:center;text-align:center;gap:0;container-type:size}
.time{font-size:min(38vh,20vw);font-size:min(38cqh,20cqw);font-weight:700;line-height:1;letter-spacing:-.03em}
.time span{font-size:.26em;font-weight:500;color:var(--mute);margin-left:.1em}
.rule{width:90px;height:4px;background:var(--red);border-radius:4px;margin:2cqh auto 2cqh}
.dateline{font-size:clamp(20px,6vh,34px);font-size:min(9cqh,5cqw);color:var(--mute)}
.quote{font-size:clamp(20px,6.5vh,32px);font-size:min(9.5cqh,4.6cqw);font-weight:600;line-height:1.25;max-width:94%;margin-top:3cqh}
.glance{display:none}
.plan{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:nowrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:82px;text-align:center}
.chip b{display:block;font-size:10px;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.chip span{font-size:13px;font-weight:600}
.chip.today{background:var(--accent);border-color:var(--accent)}
.chip.today b{color:#dfe7ff}
.chip.rest span{color:var(--mute);font-weight:500}

/* ===== cozy farm-game main page ===== */
.home{position:relative;overflow:hidden;padding:4px 4px 0;background:#111a3c}
.home>*:not(canvas){position:relative;z-index:1}
.g-bg,.g-fg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.g-bg{z-index:0}.g-fg{z-index:2}
.home .time{margin-top:auto;font-family:Poppins,system-ui,sans-serif;font-weight:700;font-size:min(30cqh,18cqw);line-height:1;letter-spacing:.05em;color:#ffffff;
  -webkit-text-stroke:.06em #3b2116;paint-order:stroke fill;text-shadow:0 .06em 0 #3b2116,0 .1em .12em rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.home .time span{font-family:Poppins,system-ui,sans-serif;font-weight:700;font-size:.3em;color:#ffd25a;margin-left:.2em;letter-spacing:.02em;-webkit-text-stroke:.1em #3b2116;paint-order:stroke fill;text-shadow:0 .1em 0 #3b2116}
.home .rule{width:min(24cqw,190px);height:min(1.4cqh,5px);border-radius:2px;margin:2.6cqh auto 2cqh;
  background:#c9843a;box-shadow:0 2px 0 #5a3214}
.home .dateline{font-family:'Pixelify Sans',monospace;font-weight:500;font-size:min(5.4cqh,3.1cqw);color:#f6e3b4;text-shadow:0 .1em 0 #5a3214}
.home .quote{margin-top:2.6cqh;margin-bottom:auto;font-family:'Pixelify Sans',monospace;font-weight:500;font-size:min(4.3cqh,2.2cqw);line-height:1.35;
  max-width:78%;text-align:left;color:#4a2a12;background:#f6e3b4;padding:.7em 1.1em .85em;border-radius:8px;
  border:4px solid #b8692a;box-shadow:0 0 0 4px #5a2e10,inset 0 0 0 3px #e9c58a,inset 0 -6px 0 #ecd3a0}
.home .quote::after{content:"";position:absolute;right:.9em;bottom:.6em;border:.4em solid transparent;border-top:.5em solid #b8692a;border-bottom:0;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.gspace{flex:none;height:34cqh}
/* priorities */
.list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.prog{height:6px;background:var(--field);border-radius:6px;overflow:hidden;margin-bottom:6px;flex:none}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.item{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:18px}
.item:first-child{border-top:0}
.box{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid #4a5ca8;display:grid;place-items:center;background:transparent;color:#fff;font-size:18px;font-weight:700;padding:0}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .t{color:var(--mute);text-decoration:line-through}
.t{flex:1;word-break:break-word;line-height:1.3;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.every{font-size:11px;color:var(--mute);font-weight:500;padding-right:10px}
.x{background:none;border:0;color:#5a6aa8;font-size:24px;padding:2px 10px}
.add{display:flex;gap:10px;margin-top:10px;flex:none}
.addbtn{flex:0 0 34%;min-height:48px;font-size:17px;position:relative;z-index:6;touch-action:manipulation}
.add input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;font-size:16px;min-width:0}

/* every-day item */
.split{flex:1;min-height:0;display:flex;gap:14px}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.daily{width:240px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.dh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.meds{display:flex;gap:18px;justify-content:center}
.mrow{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.dbox{width:64px;height:64px;border-radius:18px;border:3px solid #4a5ca8;background:transparent;color:#fff;font-size:36px;font-weight:700;display:grid;place-items:center;padding:0;transition:.2s}
.dbox.on{background:var(--accent);border-color:var(--accent)}
.dt{font-size:16px;font-weight:600;line-height:1.25}
.ds{font-size:12px;color:var(--mute)}
.ds.ok{color:#7fd8a8}
/* weight */
.wbody{flex:1;display:flex;align-items:center;gap:40px;min-height:0;padding:0 20px}
.wheelbox{position:relative;width:160px;height:240px;flex:none}
.wheel{height:240px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;padding:96px 0;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:48px;line-height:48px;text-align:center;scroll-snap-align:center;font-size:26px;color:#6676b0;font-weight:500}
.band{position:absolute;left:0;right:0;top:96px;height:48px;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);border-radius:8px;pointer-events:none;background:rgba(65,105,225,.18)}
.wstats{flex:1;min-width:0}
.big{font-size:64px;font-weight:700;line-height:1;color:var(--accent2)}
.big small{font-size:20px;color:var(--mute);font-weight:500}
.delta{font-size:15px;color:var(--mute);margin:8px 0 14px}
.delta.down{color:#7fd8a8} .delta.up{color:var(--red)}
svg.spark{width:100%;height:60px;display:block;margin-top:16px}
.week{font-size:13px;color:var(--mute);margin-top:8px}
.wbody{gap:56px;padding:0 40px}
.wstats{display:flex;align-items:center;gap:56px}
.wleft{flex:none}
.wright{flex:1;max-width:620px}
.wch{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:10px}
.wcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wk{border-radius:20px;padding:18px 16px;text-align:center}
.wk.cur{border-color:var(--accent);background:rgba(65,105,225,.16)}
.wk b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.wk span{display:block;font-size:40px;font-weight:700;color:var(--accent2);margin:6px 0 2px;line-height:1}
.wk span small{font-size:14px;color:var(--mute);font-weight:500}
.wk span.none{color:#3a4a8a}
.wk i{display:block;font-style:normal;font-size:12px;color:var(--mute)}

/* feeds */
.feed{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;column-count:2;column-gap:28px}
.feed::-webkit-scrollbar{display:none}
.ev{break-inside:avoid;padding:12px 0;border-top:1px solid var(--line)}
.ev a,.ev .tt{color:var(--text);text-decoration:none;font-weight:600;font-size:17px;line-height:1.3}
.ev .m{color:var(--mute);font-size:14px;margin-top:4px;line-height:1.45}

/* markets */
.mk{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px}
.mk::-webkit-scrollbar{display:none}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.tile .n{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tile .v{font-size:21px;font-weight:700;margin:1px 0;line-height:1.15}
.tile .c{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .c.down{color:var(--red)} .tile .c.up{color:#7fd8a8}
.tile .nt{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkctx{grid-column:span 1;font-size:10px;color:var(--mute);line-height:1.35;padding:2px 4px;overflow:hidden;align-self:center}
.mkctx .dis{color:var(--mute);font-size:9px;margin-top:3px}
/* charts */
.charts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:0;display:flex;flex-direction:column}
.chart .top{display:flex;justify-content:space-between;align-items:baseline;flex:none}
.chart .cn{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.chart .cv{font-size:15px;font-weight:700}
.chart .cp{font-size:12px;margin-left:6px;color:var(--mute)}
.chart .cp.down{color:var(--red)} .chart .cp.up{color:#7fd8a8}
.chart svg{flex:1;min-height:0;width:100%}
/* what's up baguio */
.bag{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.bcol{min-height:0;display:flex;flex-direction:column}
.bh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:600;padding-bottom:6px;border-bottom:2px solid var(--accent);flex:none}
.feed1{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.feed1::-webkit-scrollbar{display:none}
.feed1 .ev:first-child{border-top:0}
/* nav dots + pause pill */
.dots{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:8px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:7px;background:#2c3a78;transition:.3s}
.dots i.on{width:22px;background:var(--accent)}
.pill{position:absolute;left:4px;bottom:0;pointer-events:none;z-index:5;font-size:11px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;display:none}
.pill.on{display:block}

.toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-20px);background:var(--accent);color:#fff;padding:8px 18px;border-radius:30px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* night mode (12am-6am): background turns orange, text stays white */
.dim{display:none}
body{transition:background-color 1.5s}
html{transition:background-color 1.5s}
/* night: main screen only, no quote, clock + date fill the screen */
body.night .quote{display:none}
body.night .home .time{font-size:min(36cqh,21cqw)}
body.night .home .rule{margin:3.5cqh auto 3cqh}
body.night .home .dateline{font-size:min(7.5cqh,4.4cqw);color:#f6e3b4}
body.night .home .time{margin-bottom:0}body.night .home .dateline{margin-bottom:auto}
body.night .dots,body.night .pill{opacity:0}

/* ===== liquid glass (all pages except the main page) ===== */
.slide:not(.home){position:relative;isolation:isolate}
.slide:not(.home) :is(.btn,.box,.dbox,.x,.wk,.tile,.chart,.chip,input,textarea){
  background:rgba(255,255,255,.08) !important;
  border:1px solid rgba(255,255,255,.22) !important;
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.28)}
.slide:not(.home) .btn{border-radius:999px !important;padding:12px 24px}
.slide:not(.home) :is(.btn,.item.done .box,.dbox.on,.wk.cur){
  background:rgba(65,105,225,.55) !important;
  border-color:rgba(190,210,255,.55) !important}
.slide:not(.home) :is(.btn,.box,.dbox):active{transform:scale(.96)}

/* ===== main page scene stays behind the other pages, blurred ===== */
.backdrop,.backdrop-tint{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .7s ease}
.backdrop{filter:blur(16px) saturate(1.15);transform:scale(1.12)}
.backdrop-tint{background:rgba(7,13,36,.66)}
.slide:not(.home){--mute:#c6d0f2}
.slide:not(.home) .wheel div{color:#aab6e6}
.wk span{white-space:nowrap;font-size:clamp(22px,4.2vw,40px) !important}
body.offhome .backdrop,body.offhome .backdrop-tint{opacity:1}
.home>*:not(canvas){transition:opacity .45s ease,filter .45s ease}
body.offhome .home>*:not(canvas){opacity:0;filter:blur(12px)}
</style>
</head>
<body>
<div class="stage">
 <canvas class="backdrop" id="backdrop"></canvas><div class="backdrop-tint"></div>
 <div class="viewport" id="vp">
  <div class="track" id="track">

    <!-- 0 HOME -->
    <section class="slide home" id="home">
      <canvas class="g-bg" id="g-bg"></canvas>
      <div class="time" id="time">--:--<span id="ampm"></span></div>
      <div class="rule"></div>
      <div class="dateline" id="dateline"></div>
      <div class="quote" id="quote"></div>
      <div class="glance" id="glance"></div>
      <div class="gspace" id="gspace"></div>
      <canvas class="g-fg" id="g-fg"></canvas>
    </section>

    <!-- 1 PRIORITIES -->
    <section class="slide">
      <div class="head"><h1>Tasks</h1><small id="cl-count"></small></div>
      <div class="prog"><i id="cl-bar"></i></div>
      <div class="list" id="cl-list"></div>
      <div class="add" id="cl-form">
        <input id="cl-input" placeholder="Add a task…" maxlength="80" autocomplete="off" enterkeyhint="done">
        <button class="btn addbtn" type="button" id="cl-add">Add task</button>
      </div>
    </section>

    <!-- 2 WEIGHT -->
    <section class="slide">
      <div class="head"><h1>Daily weight</h1><small id="w-date"></small></div>
      <div class="wbody">
        <div class="wheelbox"><div class="wheel" id="wheel"></div><div class="band"></div></div>
        <div class="wstats">
          <div class="wleft">
            <div class="big" id="w-sel">--<small> kg</small></div>
            <div class="delta" id="w-delta">Scroll the wheel, then save</div>
            <button class="btn" id="w-save">Save today</button>
          </div>
          <div class="wright"><div class="wch">Weekly average</div><div class="wcards" id="w-weeks"></div></div>
          <svg class="spark" id="spark" viewBox="0 0 200 60" style="display:none"></svg>
          <div id="w-week" style="display:none"></div>
        </div>
      </div>
    </section>

    <!-- 4 MARKET TRENDS -->
    <section class="slide">
      <div class="head" style="display:none"><small id="u-ch"></small></div>
      <div class="charts" id="p-ch"><div class="empty">Loading…</div></div>
    </section>

    <!-- 5 WHAT'S UP BAGUIO -->
    <section class="slide">
      <div class="head"><h1>What's up Baguio</h1><small id="u-runs"></small><small id="u-ws" style="display:none"></small></div>
      <div class="bag">
        <div class="bcol"><div class="bh">Runs &amp; fitness</div><div class="feed1" id="p-runs"><div class="empty">Loading…</div></div></div>
        <div class="bcol"><div class="bh">Weekend photo &amp; video workshops</div><div class="feed1" id="p-ws"><div class="empty">Loading…</div></div></div>
      </div>
    </section>

    <!-- 5 CLAUDE NEWS -->
    <section class="slide">
      <div class="head"><h1>What Claude can do</h1><small id="u-news"></small></div>
      <div class="feed" id="p-news"><div class="empty">Loading…</div></div>
    </section>

  </div>
  <div class="dots" id="dots"></div>
  <div class="pill" id="pill">Paused · resumes in 5s</div>
  <div class="toast" id="toast"></div>
 </div>
</div>
<div class="dim" id="dim"></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
  function dataOf(s){
    if(!s) return null;
    if(typeof s.exists==="boolean" && !s.exists) return null;
    if(typeof s.data==="function") return s.data()||null;
    if(s.data && typeof s.data==="object") return s.data;
    return (typeof s==="object")? s : null;
  }
  const copy=v=>JSON.parse(JSON.stringify(v));   // synced data comes back read-only; always work on a copy
  function listOf(snap){ if(!snap) return []; const a=snap.docs||(Array.isArray(snap)?snap:[]); return a.map(dataOf).filter(Boolean); }
  let toastT;
  function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1800)}
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

  /* ================= CAROUSEL ================= */
  const SLIDE_MS = 20000;     // auto-advance every 20 s
  const HOME_MS  = 180000;    // main page stays 3 min before moving on
  const HOLD_MS  = 5000;      // after a tap or swipe, stay put; every touch restarts these 5 s
  const track=$("track"), N_SLIDES=track.children.length;
  let idx=0, lastMove=Date.now(), holdUntil=0, typing=false;
  $("dots").innerHTML = Array.from({length:N_SLIDES},()=>"<i></i>").join("");
  // seamless loop: a copy of the main page sits after the last page while wrapping
  function setX(i,anim){
    track.style.transition = anim ? "" : "none";
    track.style.transform = "translateX("+(-i*100)+"%)";
    if(!anim) void track.offsetHeight;
  }
  function makeClone(){
    const old=track.querySelector(".clone"); if(old) old.remove();
    const c=track.children[0].cloneNode(true);
    c.classList.add("clone"); c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    track.appendChild(c);
  }
  function dropClone(){ const c=track.querySelector(".clone"); if(c) c.remove(); }
  let wrapT;
  function showDots(){ [...$("dots").children].forEach((d,k)=>d.classList.toggle("on",k===idx)); }
  function go(i,fade){
    lastMove=Date.now(); clearTimeout(wrapT);
    document.body.classList.toggle("offhome", (((i%N_SLIDES)+N_SLIDES)%N_SLIDES)!==0);
    if(track.querySelector(".clone")){ setX(idx,false); dropClone(); } // finish any wrap in progress
    track.style.transition=""; track.style.opacity=1;
    if(fade){                   // automatic advance: fade out, switch, fade in
      const target=((i%N_SLIDES)+N_SLIDES)%N_SLIDES;
      track.style.opacity=0;
      wrapT=setTimeout(()=>{
        idx=target; setX(idx,false); showDots();
        track.style.transition="";
        requestAnimationFrame(()=>{ track.style.opacity=1; });
      },420);
      return;
    }
    if(i>=N_SLIDES){            // last page -> main page, sliding forward
      makeClone(); setX(N_SLIDES,true); idx=0;
      wrapT=setTimeout(()=>{ setX(0,false); dropClone(); },600);
    } else if(i<0){             // main page -> last page, sliding backward
      makeClone(); setX(N_SLIDES,false); idx=N_SLIDES-1;
      requestAnimationFrame(()=>{ setX(idx,true); wrapT=setTimeout(dropClone,600); });
    } else { idx=i; setX(i,true); }
    [...$("dots").children].forEach((d,k)=>d.classList.toggle("on",k===idx));
  }
  function hold(){ holdUntil=Date.now()+HOLD_MS; $("pill").classList.add("on"); }
  function resume(){ holdUntil=0; typing=false; lastMove=Date.now(); $("pill").classList.remove("on"); if(document.activeElement) document.activeElement.blur(); }
  setInterval(()=>{
    const now=Date.now();
    if(typing || now<holdUntil) return;
    $("pill").classList.remove("on");
    if(isNight()){            // night light hours: stay on the main page unless swiped
      holdUntil=0;
      if(idx!==0 && now-lastMove>=60000) go(0,true);   // came here by swiping: drift back to the main page after 1 min idle
      return;
    }
    if(holdUntil){ holdUntil=0; go(idx+1,true); return; }   // 5 s with no touch: carousel carries on with a fade
    if(now-lastMove>=(idx===0?HOME_MS:SLIDE_MS)) go(idx+1,true);
  },500);
  go(0);

  // swipe detection (works whether the phone is sideways or rotation-locked upright)
  const vp=$("vp"); let sx=0, sy=0, st=0;
  // iOS scrolls overflow:hidden boxes to reveal a focused input, which would shift the carousel. Undo that.
  const lockScroll=el=>el.addEventListener("scroll",()=>{ if(el.scrollLeft||el.scrollTop){ el.scrollLeft=0; el.scrollTop=0; go(idx); } },{passive:true});
  lockScroll(vp); lockScroll(document.querySelector(".stage"));
  window.addEventListener("scroll",()=>{ if(!typing && (window.scrollX||window.scrollY)) window.scrollTo(0,0); },{passive:true});
  const rotated = () => window.matchMedia("(orientation:portrait)").matches;
  vp.addEventListener("touchstart",e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
    if(e.target.closest("#pill")) return;
    hold();
  },{passive:true});
  vp.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];
    let dx=t.clientX-sx, dy=t.clientY-sy;
    if(rotated()){ const ox=dx; dx=dy; dy=-ox; } // map screen motion into the rotated page
    if(Math.abs(dx)>50 && Math.abs(dx)>1.5*Math.abs(dy) && Date.now()-st<800){
      go(idx + (dx<0?1:-1)); hold();
    }
  },{passive:true});
  // mouse / desktop: click holds, arrow keys navigate
  vp.addEventListener("mousedown",e=>{ if(!e.target.closest("#pill")) hold(); });
  document.addEventListener("keydown",e=>{
    if(typing) return;
    if(e.key==="ArrowRight"){go(idx+1);hold();} else if(e.key==="ArrowLeft"){go(idx-1);hold();}
  });
  $("pill").addEventListener("click",e=>{ e.stopPropagation(); resume(); });
  // never leave a page while typing
  document.addEventListener("focusin",e=>{ if(e.target.matches("input")) typing=true; });
  document.addEventListener("focusout",e=>{ if(e.target.matches("input")){ typing=false; hold(); } });

  /* ================= HOME: clock + quote ================= */
  const QUOTES=[
    "Small steps every day beat big plans that never start.",
    "Do the hard thing first. The rest of the day gets lighter.",
    "You don't need more time. You need fewer distractions.",
    "Progress, not perfection. Ship it, then make it better.",
    "Discipline is choosing what you want most over what you want now.",
    "Every frame you shoot today is practice for the one that matters.",
    "Start before you feel ready. Ready comes from starting.",
    "Your future self is watching. Give them something to thank you for.",
    "One focused hour beats a distracted day.",
    "Consistency is quiet, but it always wins in the end.",
    "Make today's work the kind you'd proudly put in your reel.",
    "The body you want is built in the choices nobody sees.",
    "Clients remember how you made them feel, not just what you made.",
    "Rest is part of the plan, not a break from it.",
    "If it matters, put it on the list. If it's on the list, do it.",
    "Be the person who finishes.",
    "A good story is just a hundred small decisions made with care.",
    "You are one good habit away from a different year.",
    "Win the morning and the day will follow.",
    "Don't wait for motivation. Build momentum.",
    "Today's sweat is tomorrow's confidence.",
    "Great work hides in ordinary days. Show up for them.",
    "Do less, but do it all the way.",
    "The edit is where the story is found. So is the life.",
    "Hard days count double. Keep going.",
    "Light is everywhere. So is opportunity. Learn to see both.",
    "Earn your weekend. Then enjoy it fully.",
    "Your only competition is who you were yesterday.",
    "Keep the promise you made to yourself this morning.",
    "Slow is smooth, smooth is fast.",
    "Make something today that didn't exist yesterday."
  ];
  function quoteOfDay(d){ const start=new Date(d.getFullYear(),0,0); const n=Math.floor((d-start)/864e5); return QUOTES[n%QUOTES.length]; }
  let todayKey=dayKey(new Date());
  const NIGHT_ON=true;    // night mode (12am-6am) is switched off for now; set to true to bring it back
  const isNight=()=>NIGHT_ON && new Date().getHours()<6;
  const TZ="Asia/Manila";   // always show Philippine time, whatever the phone is set to
  const phNow=()=>new Date(new Date().toLocaleString("en-US",{timeZone:TZ}));
  function tick(){
    const d=phNow();
    let h=d.getHours(); const ap=h>=12?"pm":"am"; h=h%12||12;
    $("time").firstChild.nodeValue=h+":"+pad(d.getMinutes());
    $("ampm").textContent=ap;
    $("dateline").textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
    $("quote").textContent=quoteOfDay(d);
    $("w-date").textContent=d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    document.body.classList.toggle("night", isNight());
    if(dayKey(d)!==todayKey){ todayKey=dayKey(d); subscribeChecklist(); renderWeights(); }
    renderGlance();
  }
  // weekly training plan (index = Date.getDay(), 0 = Sunday)
  const PLAN=["Long run","Cardio","Lifting","Rest","Cardio","Lifting","Long run"];
  const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const todayWorkout=()=>{ const w=PLAN[new Date().getDay()]; return w==="Rest"?null:w; };
  function renderGlance(){
    const t=totals(), parts=[t.done+" of "+t.total+" done today"];
    if(!items.length) parts.push("no priorities added yet");
    const last=weights[weights.length-1];
    if(last) parts.push("last weight "+last.kg.toFixed(1)+" kg");
    if(weights.length) parts.push("avg "+(weights.reduce((a,x)=>a+x.kg,0)/weights.length).toFixed(1)+" kg");
    $("glance").textContent=parts.join("  ·  ");
  }
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}

  /* ================= STORAGE ================= */
  let db=null;

  /* ================= PRIORITIES ================= */
  let items=[], unsubCL=null, unsubMed=null, med={am:false,pm:false,wk:false};
  function medRow(k,label){
    const on=med[k];
    return '<div class="item'+(on?' done':'')+'"><button class="box" data-m="'+k+'" aria-label="toggle">'+(on?'✓':'')+'</button><span class="t">Cuddley\'s medicine · '+label+'</span><span class="every">Every day</span></div>';
  }
  function totals(){ const w=todayWorkout()?1:0; return {total:items.length+2+w, done:items.filter(i=>i.done).length+(med.am?1:0)+(med.pm?1:0)+(w&&med.wk?1:0)}; }
  function renderCL(){
    const box=$("cl-list");
    const w=todayWorkout();
    const workRow = w ? '<div class="item'+(med.wk?' done':'')+'"><button class="box" data-m="wk" aria-label="toggle">'+(med.wk?'✓':'')+'</button><span class="t">Workout · '+w+'</span><span class="every">Today</span></div>' : '';
    box.innerHTML = workRow + medRow("am","Morning") + medRow("pm","Evening") + (items.length ? items.map((it,i)=>
      '<div class="item'+(it.done?' done':'')+'"><button class="box" data-i="'+i+'" aria-label="toggle">'+(it.done?'✓':'')+'</button><span class="t">'+esc(it.t)+'</span>'+(it.carried&&!it.done?'<span class="every">Carried over</span>':'')+'<button class="x" data-x="'+i+'" aria-label="remove">×</button></div>').join("")
      : '<div class="empty" style="padding-top:12px">No tasks yet. What needs to get done today?</div>');
    const t=totals();
    $("cl-count").textContent = t.done+" / "+t.total+" done";
    $("cl-bar").style.width = (100*t.done/t.total)+"%";
    renderGlance();
  }
  let lastLocalWrite=0;
  async function saveCL(note){
    const key=todayKey; lsSet("cl-"+key,items); lastLocalWrite=Date.now();
    if(db){ try{ await db.doc("checklist/"+key).set({date:key,items,carried:true}); if(note) toast(note); }
            catch(e){ log("save failed "+((e&&e.code)||(e&&e.message))); toast("Not synced: "+((e&&e.code)||(e&&e.message)||"error").toString().slice(0,40)); } }
    else if(note) toast(note+" (this phone only)");
  }
  function renderMed(){ renderCL(); }
  async function saveMed(){
    lsSet("med-"+todayKey,med);
    if(db){ try{ await db.doc("daily/"+todayKey).set({date:todayKey,cuddleyAm:med.am,cuddleyPm:med.pm,workout:med.wk}); }catch(e){ toast("Couldn't sync"); } }
  }
  function subscribeChecklist(){
    if(unsubCL){try{unsubCL()}catch(e){} unsubCL=null;}
    if(unsubMed){try{unsubMed()}catch(e){} unsubMed=null;}
    { const m=lsGet("med-"+todayKey); med={am:!!(m&&m.am),pm:!!(m&&m.pm),wk:!!(m&&m.wk)}; } renderMed();
    if(db){ try{ unsubMed=db.doc("daily/"+todayKey).onSnapshot(s=>{ const d=dataOf(s); if(d&&(typeof d.cuddleyAm==="boolean"||typeof d.cuddleyPm==="boolean")){ med={am:!!d.cuddleyAm,pm:!!d.cuddleyPm,wk:!!d.workout}; lsSet("med-"+todayKey,med); renderMed(); } }); }catch(e){} }
    items=lsGet("cl-"+todayKey)||[]; renderCL();
    if(db){ try{
      unsubCL=db.doc("checklist/"+todayKey).onSnapshot(s=>{ const d=dataOf(s); if(d&&Array.isArray(d.items)&&Date.now()-lastLocalWrite>3000){items=copy(d.items);lsSet("cl-"+todayKey,items);renderCL();} carryOver(d); });
    }catch(e){} }
    setTimeout(()=>carryOver(null),4000);   // fallback if no snapshot arrives (or no database)
  }
  // anything left unfinished yesterday moves onto today's list
  let carriedFor="";
  async function getDayItems(key){
    let list=null;
    if(db){ try{ const sn=await db.doc("checklist/"+key).get(); const d=dataOf(sn); if(d&&Array.isArray(d.items)) list=copy(d.items); }catch(e){} }
    if(!list){ const l=lsGet("cl-"+key); if(Array.isArray(l)) list=l; }
    return list||[];
  }
  async function carryOver(d){
    if(carriedFor===todayKey) return;
    if((d&&d.carried)||lsGet("carried-"+todayKey)){ carriedFor=todayKey; return; }
    carriedFor=todayKey;
    const y=new Date(); y.setDate(y.getDate()-1);
    const prev=await getDayItems(dayKey(y));
    const have=new Set(items.map(i=>i.t));
    const add=prev.filter(i=>!i.done&&!have.has(i.t)).map(i=>({t:i.t,done:false,carried:true}));
    if(add.length) items=items.concat(add);
    lsSet("carried-"+todayKey,true);
    renderCL(); saveCL();
  }
  $("cl-list").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.i!==undefined){const i=+b.dataset.i; items[i].done=!items[i].done; renderCL(); saveCL();}
    else if(b.dataset.x!==undefined){items.splice(+b.dataset.x,1); renderCL(); saveCL();}
    else if(b.dataset.m){ med[b.dataset.m]=!med[b.dataset.m]; renderCL(); saveMed(); }
  });
  function log(){}
  // add without relying on form submit (blocked in some sandboxed frames on iPhone)
  function addTask(){
   try{
    const v=$("cl-input").value.trim(); log("addTask len="+v.length+" db="+(!!db)); if(!v) return;
    items.push({t:v,done:false}); $("cl-input").value=""; renderCL(); saveCL("Task added");
    $("cl-input").blur(); log("added ok, items="+items.length);
   }catch(e){ log("addTask threw "+(e&&e.message)); toast("Error: "+(e&&e.message)); }
  }
  const addBtn=$("cl-add");
  // act on touch so the closing keyboard can't move the button before the tap lands
  addBtn.addEventListener("touchend",e=>{ e.preventDefault(); addTask(); });
  addBtn.addEventListener("mousedown",e=>e.preventDefault());   // keep focus in the box on desktop
  addBtn.addEventListener("click",addTask);
  $("cl-input").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.keyCode===13){ e.preventDefault(); addTask(); } });
  // closing the keyboard (iPhone "Done", tapping elsewhere) also saves what was typed
  $("cl-input").addEventListener("blur",()=>{ if($("cl-input").value.trim()) addTask(); });

  /* ================= WEIGHT ================= */
  const MIN=50.0, MAX=120.0, ROW=48, wheel=$("wheel"), N=Math.round((MAX-MIN)*10)+1;
  (function(){const f=document.createDocumentFragment(); for(let i=0;i<N;i++){const d=document.createElement("div"); d.textContent=(MIN+i/10).toFixed(1); f.appendChild(d);} wheel.appendChild(f);})();
  const valAt=()=>{const i=Math.max(0,Math.min(N-1,Math.round(wheel.scrollTop/ROW))); return Math.round((MIN+i/10)*10)/10;};
  const setWheel=v=>{wheel.scrollTop=Math.round((v-MIN)*10)*ROW; showSel();};
  function showSel(){ $("w-sel").firstChild.nodeValue=valAt().toFixed(1); }
  wheel.addEventListener("scroll",()=>{ requestAnimationFrame(showSel); hold(); },{passive:true});
  let weights=[], wheelInit=false;
  function renderMonth(){
    const m=todayKey.slice(0,7), ranges=[[1,7],[8,14],[15,21],[22,31]], mon=new Date().toLocaleString("en",{month:"short"});
    const wk=ranges.map(([lo,hi],i)=>{
      const l=weights.filter(w=>w.date.slice(0,7)===m&&+w.date.slice(8,10)>=lo&&+w.date.slice(8,10)<=hi);
      return {n:i+1,lbl:mon+" "+lo+"-"+(i===3?"end":hi),days:l.length,avg:l.length?l.reduce((a,x)=>a+x.kg,0)/l.length:null,cur:+todayKey.slice(8,10)>=lo&&+todayKey.slice(8,10)<=hi};
    });
    $("w-weeks").innerHTML=wk.map(w=>'<div class="wk'+(w.cur?" cur":"")+'"><b>Week '+w.n+'</b>'+
      (w.avg===null?'<span class="none">--</span>':'<span>'+w.avg.toFixed(1)+'<small> kg</small></span>')+'<i>'+w.lbl+'</i></div>').join("");
  }
  function renderWeights(){
    weights.sort((a,b)=>a.date<b.date?-1:1);
    const last=weights[weights.length-1];
    if(!wheelInit){ wheelInit=true; setWheel(last?last.kg:81.0); }
    const dEl=$("w-delta");
    if(last){
      const prev=weights[weights.length-2];
      let txt=(last.date===todayKey?"Saved today · ":"Last "+last.date.slice(5)+" · ")+last.kg.toFixed(1)+" kg";
      dEl.className="delta";
      if(prev){const df=last.kg-prev.kg; txt+=" ("+(df>0?"+":"")+df.toFixed(1)+")"; dEl.className="delta "+(df<0?"down":df>0?"up":"");}
      dEl.textContent=txt;
    } else dEl.textContent="Scroll the wheel, then save";
    const now=new Date(), dk=n=>{const d=new Date(now);d.setDate(d.getDate()-n);return dayKey(d)};
    const tw=weights.filter(w=>w.date>dk(7)&&w.date<=dk(0)), pw=weights.filter(w=>w.date>dk(14)&&w.date<=dk(7));
    const avg=a=>a.reduce((s,x)=>s+x.kg,0)/a.length;
    let wk="Log daily to build your weekly average.";
    if(tw.length){ wk="This week avg "+avg(tw).toFixed(1)+" kg ("+tw.length+" days)"; if(pw.length){const d=avg(tw)-avg(pw); wk+=" · "+(d>0?"+":"")+d.toFixed(1)+" vs last week";} }
    $("w-week").textContent=wk;
    renderMonth();
    const pts=weights.slice(-14), sp=$("spark");
    if(pts.length<2){sp.innerHTML="";}
    else{
      const lo=Math.min(...pts.map(p=>p.kg))-.3, hi=Math.max(...pts.map(p=>p.kg))+.3;
      const xy=pts.map((p,i)=>[(i/(pts.length-1))*196+2, 56-((p.kg-lo)/(hi-lo))*52]);
      sp.innerHTML='<polyline fill="none" stroke="#4169e1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+xy.map(p=>p.join(",")).join(" ")+'"/>'+
        '<circle cx="'+xy[xy.length-1][0]+'" cy="'+xy[xy.length-1][1]+'" r="3.5" fill="#e63946"/>';
    }
    renderGlance();
  }
  $("w-save").addEventListener("click",async()=>{
    const kg=valAt(), date=todayKey, i=weights.findIndex(w=>w.date===date);
    if(i>=0) weights[i].kg=kg; else weights.push({date,kg});
    lsSet("weights",weights); renderWeights();
    if(db){ try{ await db.doc("weight/"+date).set({date,kg,ts:Date.now()}); toast("Saved "+kg.toFixed(1)+" kg"); }catch(e){ toast("Saved on this phone only"); } }
    else toast("Saved on this phone only");
  });

  /* ================= FEEDS ================= */
  function evHtml(list){
    if(!list||!list.length) return '<div class="empty">Nothing confirmed yet. It refreshes weekly.</div>';
    return list.map(e=>{
      const u=safeUrl(e.url);

  function fmtNum(v){ return v>=1000? v.toLocaleString("en-US",{maximumFractionDigits:0}) : v.toFixed(2); }
  function chartHtml(s){
    const pts=(s.pts||[]).filter(p=>typeof p[1]==="number"); if(pts.length<2) return "";
    const W=300,H=120,L=8,R=8,T=10,B=22;
    const ys=pts.map(p=>p[1]); let lo=Math.min(...ys), hi=Math.max(...ys); const pd=(hi-lo)*0.15||1; lo-=pd; hi+=pd;
    const X=i=>L+(i/(pts.length-1))*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
    const xy=pts.map((p,i)=>[X(i),Y(p[1])]);
    const first=pts[0][1], last=pts[pts.length-1][1], pct=(last/first-1)*100;
    const dir=pct<0?"down":pct>0?"up":"";
    const area='M'+xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")+' L'+xy[xy.length-1][0]+","+(H-B)+' L'+xy[0][0]+","+(H-B)+' Z';
    const labels=pts.map((p,i)=>'<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'" fill="#9aa8d8" font-size="9">'+esc(p[0])+'</text>').join("");
    const dots=xy.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===xy.length-1?4:2.6)+'" fill="'+(i===xy.length-1&&pct<0?'#e63946':'#9fb4ff')+'"/>').join("");
    return '<div class="chart"><div class="top"><span class="cn">'+esc(s.name)+'</span><span><span class="cv">'+fmtNum(last)+'</span><span class="cp '+dir+'">'+(pct>0?"+":"")+pct.toFixed(1)+'%</span></span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<path d="'+area+'" fill="rgba(65,105,225,.18)"/>'+
      '<polyline fill="none" stroke="#4169e1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>'+dots+labels+'</svg></div>';
  }

        const c=o[y*W2+x]; if(c!==OUT) continue;
        let edge=false; for(const[dx,dy] of N4) if(!g(x+dx,y+dy)) edge=true;
        let fill=0; for(const[dx,dy] of N8){ const n=g(x+dx,y+dy); if(n&&n!==OUT&&!EYES.has(n)){ fill=n; break; } }
        if(!edge){ if(fill) d[y*W2+x]=fill; }          // thin the doubled outline to 1 fine pixel
        else if(fill) d[y*W2+x]=dk(fill,.42);           // coloured outline like Stardew's
      }
      const q=d.slice(), G=(x,y)=>(x<0||y<0||x>=W2||y>=H2)?0:q[y*W2+x];
      for(let y=0;y<H2;y++) for(let x=0;x<W2;x++){
        const c=q[y*W2+x]; if(!c) continue;
        if(EYES.has(c)){ if(!EYES.has(G(x,y-1))&&!EYES.has(G(x-1,y))) d[y*W2+x]=0xffffffff; continue; }   // eye shine
        const up=G(x,y-1), up2=G(x,y-2), dn=G(x,y+1), dn2=G(x,y+2);
        if(!up||!up2) continue;
        if(!dn) d[y*W2+x]=dk(c,.8); else if(!dn2) d[y*W2+x]=dk(c,.9);                                  // soft underside
      }
      hix.putImageData(img,0,0);
    }
    const bd=$("backdrop"), bdx=bd.getContext("2d"); let skip=0;
    function loop(){
      setTimeout(loop,1000/12);
      if(document.hidden) return;
      if(idx!==0 && (++skip)%2) return;   // behind the blur: half frame rate is plenty
      if(!layout()) return;
      frame++;
      // live sky + cached ground
      if(skyC.width!==gw||skyC.height!==gh){ skyC.width=gw; skyC.height=gh; }
      drawSky(skx); skx.drawImage(off,0,0);
      blit(bgx,skyC);
      fx.clearRect(0,0,gw,gh);
      director(); people.forEach(stepP); cats.forEach(step); stepFight();
      outlined(fx,g=>{ drawExtras(g); drawRadio(g,true); });
      cats.forEach(c=>drawCat(fx,c)); drawFight(fx); drawFur(fx);
      outlined(fx,g=>{ people.forEach(p=>{ if(p.on) drawPerson(g,p); }); });
      drawNotes(fx); drawHearts(fx);
      hiRes(); blit(fgx,hi);
      if(idx!==0){ if(bd.width!==gw||bd.height!==gh){ bd.width=gw; bd.height=gh; } bdx.drawImage(skyC,0,0); bdx.drawImage(hi,0,0,gw,gh); }
    }
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{W=0;});
    loop();
  })();

  /* ================= BOOT ================= */
  weights=lsGet("weights")||[];
  subscribeChecklist(); renderWeights(); tick(); setInterval(tick,15000);
  (async()=>{
    try{ db=(window.claude&&window.claude.use)? await window.claude.use("db") : null; }catch(e){ db=null; }
    bindFeeds(); subscribeChecklist();
  })();
  setTimeout(()=>location.reload(), 6*3600*1000);
})();
</script>
